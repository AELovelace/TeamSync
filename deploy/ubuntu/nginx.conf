server {
  listen 80;
  listen [::]:80;
  server_name __SERVER_NAME__;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name __SERVER_NAME__;

  # Self-signed today. For Let's Encrypt, point these at
  # /etc/letsencrypt/live/__SERVER_NAME__/fullchain.pem and privkey.pem.
  ssl_certificate __TLS_CERT_FILE__;
  ssl_certificate_key __TLS_KEY_FILE__;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:TeamSyncTLS:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=31536000" always;
  client_max_body_size 30m;

  location /static/ {
    alias __APP_DIR__/teamsync/web/static/;
    expires 1h;
  }

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 300s;
    proxy_pass http://127.0.0.1:__APP_PORT__;
  }
}
