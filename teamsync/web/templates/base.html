<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TeamSync{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">TeamSync</a>
  {% if user %}
  <nav>
    <a href="/" {% if request.url.path == '/' %}class="active"{% endif %}>Dashboard</a>
    <a href="/entries" {% if request.url.path.startswith('/entries') %}class="active"{% endif %}>Entries</a>
    <a href="/files" {% if request.url.path.startswith('/files') %}class="active"{% endif %}>Files</a>
    <a href="/properties" {% if request.url.path.startswith('/properties') %}class="active"{% endif %}>Properties</a>
    {% if user.role == 'admin' %}<a href="/admin" {% if request.url.path.startswith('/admin') %}class="active"{% endif %}>Admin</a>{% endif %}
  </nav>
  <form class="logout" method="post" action="/logout">
    <span class="who">{{ user.username }} · {{ user.role }}</span>
    <button type="submit" class="link">Sign out</button>
  </form>
  {% endif %}
</header>
<main>
  {% if msg %}<div class="flash ok">{{ msg }}</div>{% endif %}
  {% if err %}<div class="flash err">{{ err }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
